<!doctype html>
<!-- Ciste — atelier de rendu three.js : ne sert plus qu'à l'orgue à parfums (vue=orgue). Les flacons, gros plans,
     coffret et fioles du site sont rendus dans Blender (outils/blender/). Utilisé par outils/rendre.cjs ; ?vue=…&id=… -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ciste · rendu des vues</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#e3e5df}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="../donnees.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { T, creerRendu, construireFlacon, poserFlacon, cadrer, construireCoffret, construireFioleSeule, construireOrgue, FOND } from "./flacon3d.js";
const q = new URLSearchParams(location.search);
const vue = q.get("vue"), id = q.get("id");
const P = window.CISTE.parfums;
await document.fonts.load('500 112px "Bodoni Moda"');
await document.fonts.load('italic 400 92px "Bodoni Moda"');
await document.fonts.load('500 36px "Schibsted Grotesk"');
const canvas = document.getElementById("c");
const VUES = {
  flacon: { l: 800, h: 1000, c: { cx: 0.5, cy: 0.5, fr: 0.8, el: 7 }, s: { rotY: -0.16 } },
  eclate: { l: 900, h: 1000, c: { cx: 0.5, cy: 0.52, fr: 0.86, el: 13, refY: 1.55, refH: 4.6 }, s: { rotY: 0.2, eclate: 1, leve: 1, temps: 1.3 } },
  "gros-bouchon": { l: 600, h: 600, c: { cx: 0.5, cy: 0.56, fr: 0.62, el: 18, refY: 3.85, refH: 1.6 }, s: { rotY: -0.3 } },
  "gros-verre": { l: 600, h: 600, c: { cx: 0.5, cy: 0.5, fr: 0.62, el: 2, refY: 0.7, refH: 1.7 }, s: { rotY: 2.4 } },
  "gros-etiquette": { l: 600, h: 600, c: { cx: 0.5, cy: 0.5, fr: 0.95, el: 4, refY: 1.37, refH: 1.62 }, s: { rotY: -0.05 } },
};
const conf = VUES[vue];
let l = +(q.get("l") || conf?.l || 1200), h = +(q.get("h") || conf?.h || 800);
canvas.style.width = l + "px"; canvas.style.height = h + "px";
const { r, env } = creerRendu(canvas, { conserver: true, ratio: 1 });
r.setSize(l, h, false);
const camera = new T.PerspectiveCamera(24, l / h, 0.1, 200);
if (vue === "orgue") {
  r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
  const { scene } = construireOrgue({ env });
  camera.fov = 30; camera.aspect = l / h;
  camera.position.set(0.15, 1.35, 5.4); camera.lookAt(0, 0.35, -0.6); camera.updateProjectionMatrix();
  r.render(scene, camera);
} else if (vue === "coffret") {
  const { scene } = construireCoffret({ env, couleurs: P.map((p) => p.liquide) });
  cadrer(camera, { cx: 0.5, cy: 0.5, fr: 0.86, el: 20, refY: 1.9, refH: 4.4 }, l, h);
  r.render(scene, camera);
} else if (vue === "fiole") {
  const m = window.CISTE.matieres.find((x) => x.id === id);
  const { scene } = construireFioleSeule({ env, fond: m.fond, couleur: m.couleur });
  cadrer(camera, { cx: 0.5, cy: 0.5, fr: 0.66, el: 10, refY: 1.05, refH: 2.4 }, l, h);
  r.render(scene, camera);
} else {
  const p = P.find((x) => x.id === (id || "garrigue"));
  const m = construireFlacon({ env, fond: q.get("fond") || FOND });
  poserFlacon(m, { ...conf.s, couleur: new T.Color(p.liquide), nom: p.nom });
  cadrer(camera, conf.c, l, h);
  r.render(m.scene, camera);
}
window.rendu = "ok";
</script>
</body>
</html>
