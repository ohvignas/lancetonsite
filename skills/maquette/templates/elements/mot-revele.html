<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>/* Mode aperçu (?apercu) : masque les explications pour la galerie */ if (/[?&]apercu\b/.test(location.search)) document.documentElement.classList.add("apercu");</script>
<style>.apercu [data-explication] { display: none !important; }</style>
<title>Élément — Mot révélé à la souris</title>
<meta name="description" content="Un mot du titre rayonne au repos ; une sphère autour de la souris le gratte et révèle des couleurs. Le texte ne bouge jamais.">
<style>
  /* ===== Le mot révélé (à copier) ===== */
  [data-mot-revele] { position: relative; display: inline-block; cursor: default; touch-action: manipulation; --halo: linear-gradient(90deg, rgba(47,111,237,.85), rgba(255,255,255,.75) 50%, rgba(239,65,53,.85)); }
  [data-mot-revele]::before { content: ""; position: absolute; inset: -.28em -.42em; z-index: -1; border-radius: 50%; pointer-events: none; background: var(--halo); filter: blur(18px); opacity: calc(.34 + .4 * var(--pres, 0)); animation: mot-rayonne 3.2s ease-in-out infinite; }
  [data-mot-revele] canvas { position: absolute; pointer-events: none; z-index: 1; display: none; }
  @keyframes mot-rayonne { 50% { opacity: calc(.2 + .4 * var(--pres, 0)); } }
  @media (prefers-reduced-motion: reduce) { [data-mot-revele]::before { animation: none; } }

  /* ===== Démo ===== */
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; background: #0b2a52; -webkit-font-smoothing: antialiased; }
  .scene { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1.4rem; padding: 3rem 1.25rem; text-align: center; overflow: hidden; isolation: isolate; }
  h1 { font-size: clamp(2.2rem, 6vw, 5rem); line-height: 1.08; letter-spacing: -.03em; font-weight: 700; max-width: 16ch; text-wrap: balance; }
  h1 em { font-weight: 500; }
  .note { font-size: 1rem; opacity: .78; max-width: 34rem; line-height: 1.5; }
</style>
</head>
<body>
<main class="scene">
  <h1>Une boulangerie <em data-mot-revele data-couleurs="#2F6FED,#ffffff,#EF4135">française</em> de quartier</h1>
  <p class="note" data-explication>Approchez la souris du mot. Au doigt : touchez-le. Marque fictive.</p>
</main>
<script>
/* ===== Le mot révélé (à copier) ===== */
(() => {
  const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const apercu = document.documentElement.classList.contains("apercu");
  const borne = (v) => Math.min(1, Math.max(0, v)), doux = (t) => t * t * (3 - 2 * t), mix = (a, b, t) => a + (b - a) * t;
  document.querySelectorAll("[data-mot-revele]").forEach((mot) => {
    if (calme) return;
    const couleurs = (mot.dataset.couleurs || "#2F6FED,#ffffff,#EF4135").split(",");
    const PAD = 170, PORTEE = Number(mot.dataset.portee || 95); // portée en px : environ 2 cm autour du mot
    const cv = document.createElement("canvas"); cv.setAttribute("aria-hidden", "true"); mot.append(cv);
    const texte = mot.firstChild.textContent;
    const c = cv.getContext("2d"), gr = document.createElement("canvas"), g = gr.getContext("2d"), dr = document.createElement("canvas"), d = dr.getContext("2d");
    let D = 1, w = 0, h = 0, X = 0, Y = 0, cible = 0, proch = 0, sx = 0, sy = 0, px = 0, py = 0, lx = null, ly = null, raf = 0, auto = null, gratte = 0;
    const mesure = () => {
      const r = mot.getBoundingClientRect(), s = getComputedStyle(mot);
      D = Math.min(2, devicePixelRatio || 1); w = r.width; h = r.height; X = Math.ceil((w + PAD * 2) * D); Y = Math.ceil((h + PAD * 2) * D);
      cv.width = gr.width = dr.width = X; cv.height = gr.height = dr.height = Y;
      cv.style.width = X / D + "px"; cv.style.height = Y / D + "px"; cv.style.left = -PAD + "px"; cv.style.top = -PAD + "px";
      d.setTransform(D, 0, 0, D, 0, 0); d.clearRect(0, 0, X, Y);
      d.font = `${s.fontStyle} ${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
      if ("letterSpacing" in d) d.letterSpacing = s.letterSpacing === "normal" ? "0px" : s.letterSpacing;
      const m = d.measureText(texte), base = PAD + (h - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
      d.fillStyle = "#000"; d.fillText(texte, PAD, base); d.globalCompositeOperation = "source-atop";
      couleurs.forEach((k, i) => { const larg = w / couleurs.length; d.fillStyle = k; d.fillRect(i ? PAD + larg * i : 0, 0, i === couleurs.length - 1 ? X : (i ? larg : PAD + larg), Y); });
      d.globalCompositeOperation = "source-over";
      g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, X, Y); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, X, Y); lx = null;
    };
    const R = () => 30 + 20 * proch;
    const coup = (x, y, a) => { const r = R() * D, f = g.createRadialGradient(x * D, y * D, r * .6, x * D, y * D, r); f.addColorStop(0, `rgba(0,0,0,${a})`); f.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = f; g.beginPath(); g.arc(x * D, y * D, r, 0, 7); g.fill(); };
    const pas = (now) => {
      raf = 0;
      if (auto) { const q = (now - auto.d) / auto.dur; if (q >= 1) { auto = null; cible = 0; } else { px = PAD - 40 + (w + 80) * q; py = PAD + h / 2; cible = 1; } }
      sx += (px - sx) * .28; sy += (py - sy) * .28; proch += (cible - proch) * .14; if (proch < .004 && !cible) proch = 0;
      mot.style.setProperty("--pres", proch.toFixed(3));
      // la couleur reste un instant derrière la sphère, puis s'efface
      g.globalCompositeOperation = "destination-out"; g.fillStyle = "rgba(0,0,0,.022)"; g.fillRect(0, 0, X, Y); g.globalCompositeOperation = "source-over";
      if (proch > .05) { const a = Math.min(1, proch * 1.5), n = lx === null ? 1 : Math.min(14, Math.ceil(Math.hypot(sx - lx, sy - ly) / 8)); for (let i = 1; i <= n; i++) { const q = i / n; coup(lx === null ? sx : mix(lx, sx, q), ly === null ? sy : mix(ly, sy, q), a); } lx = sx; ly = sy; gratte = now; } else lx = null;
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, X, Y); c.drawImage(dr, 0, 0); c.globalCompositeOperation = "destination-in"; c.drawImage(gr, 0, 0); c.globalCompositeOperation = "source-over";
      if (proch > .01) { // la sphère de verre, cerclée des couleurs
        const r = R() * D, x = sx * D, y = sy * D; c.globalAlpha = proch;
        const v = c.createRadialGradient(x - r * .3, y - r * .35, r * .05, x, y, r); v.addColorStop(0, "rgba(255,255,255,.2)"); v.addColorStop(.72, "rgba(255,255,255,.05)"); v.addColorStop(1, "rgba(255,255,255,.24)"); c.fillStyle = v; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
        c.lineWidth = 2 * D; const tour = 6.283 / couleurs.length; couleurs.forEach((k, i) => { c.strokeStyle = k; c.beginPath(); c.arc(x, y, r, 2.2 + tour * i, 2.2 + tour * (i + 1)); c.stroke(); }); c.globalAlpha = 1;
      }
      cv.style.display = "block";
      if (proch > 0 || cible > 0 || auto || now - gratte < 3200) raf = requestAnimationFrame(pas); else cv.style.display = "none";
    };
    const lance = () => { if (!raf) raf = requestAnimationFrame(pas); };
    const balaye = () => { sx = PAD - 40; sy = PAD + h / 2; px = sx; py = sy; auto = { d: performance.now(), dur: 1500 }; lance(); };
    ((document.fonts && document.fonts.ready) || Promise.resolve()).then(() => {
      mesure(); addEventListener("resize", mesure);
      addEventListener("pointermove", (e) => {
        if (e.pointerType === "touch" || auto) return;
        const r = mot.getBoundingClientRect(), dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom), n = borne(1 - Math.hypot(dx, dy) / PORTEE);
        if (n <= 0 && cible <= 0) return;
        if (!cible && !proch) { sx = e.clientX - r.left + PAD; sy = e.clientY - r.top + PAD; }
        px = e.clientX - r.left + PAD; py = e.clientY - r.top + PAD; cible = doux(n); lance();
      }, { passive: true });
      mot.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch") balaye(); });
      if (apercu) { balaye(); setInterval(balaye, 2600); }
    });
  });
})();
</script>
</body>
</html>
