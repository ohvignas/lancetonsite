<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>/* Mode aperçu (?apercu) : masque les explications pour la galerie */ if (/[?&]apercu\b/.test(location.search)) document.documentElement.classList.add("apercu");</script>
<style>.apercu [data-explication] { display: none !important; }</style>
<title>Élément — Bouton chromé</title>
<meta name="description" content="Bouton à lunette de métal poli : un liseré en dégradé conique dont le reflet fait un tour au survol, face bombée et enfoncement au clic. CSS pur avec @property.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif&display=swap">
<style>
  /* ===== Le bouton chromé (à copier) ===== */
  @property --chr-angle { syntax: "<angle>"; inherits: false; initial-value: 30deg; }
  .chrome {
    --chr-face: #fdfdfc;        /* face du bouton */
    --chr-texte: #1d1d1f;
    --chr-epaisseur: 3px;       /* épaisseur de la lunette */
    --chr-duree: 1.1s;          /* durée du tour de reflet */
    --chr-anneau: #1d1d1f;      /* anneau de focus, accordé au métal (≥ 12:1 sur le fond gris perle) */
    /* lunette : un seul endroit pour changer la teinte du métal */
    --chr-lunette: conic-gradient(from var(--chr-angle), #8a8d93, #fbfbfb 12%, #a9acb2 24%, #3c3f45 36%, #d8dade 50%, #fff 60%, #7c8086 72%, #e9eaec 86%, #8a8d93);
    --chr-degrade: linear-gradient(180deg, #fff, var(--chr-face) 55%, #ecebe8); /* face */
    position: relative; isolation: isolate; display: inline-flex; align-items: center; justify-content: center;
    min-height: 52px; padding: 0 2rem; border: var(--chr-epaisseur) solid transparent; border-radius: 999px; cursor: pointer; text-decoration: none;
    font: 600 1rem/1 "Instrument Sans", system-ui, sans-serif; color: var(--chr-texte);
    /* face (padding-box) + lunette (border-box) : deux fonds empilés */
    background:
      var(--chr-degrade) padding-box,
      var(--chr-lunette) border-box;
    box-shadow: 0 1px 0 rgb(255 255 255 / .9) inset, 0 -2px 6px rgb(0 0 0 / .06) inset, 0 2px 3px rgb(0 0 0 / .12), 0 10px 22px -10px rgb(0 0 0 / .35);
    transition: --chr-angle var(--chr-duree) cubic-bezier(.3, .1, .2, 1), transform .12s, box-shadow .12s;
  }
  .chrome:hover, .chrome:focus-visible { --chr-angle: 390deg; }
  .chrome:active { transform: translateY(1px); box-shadow: 0 1px 4px rgb(0 0 0 / .14) inset, 0 1px 2px rgb(0 0 0 / .12); }
  .chrome:focus-visible { outline: 3px solid var(--chr-anneau); outline-offset: 4px; }
  .chrome.plein { --chr-face: #1d1d1f; --chr-texte: #f5f5f4; --chr-degrade: linear-gradient(180deg, #3a3a3d, #1d1d1f 60%, #111); }
  @media (prefers-reduced-motion: reduce) { .chrome { transition: transform .12s, box-shadow .12s; } }
  @media (forced-colors: active) { .chrome { border-color: ButtonText; } }

  /* ===== Démo ===== */
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Instrument Sans", system-ui, sans-serif; color: #1d1d1f; background: #e7e6e3; -webkit-font-smoothing: antialiased; }
  .scene { min-height: 100svh; display: grid; place-items: center; padding: 4rem 1.25rem; background: radial-gradient(70% 60% at 50% 35%, #f4f3f1, #dcdad6); }
  .bloc { max-width: 46rem; text-align: center; }
  .sur { font-size: .9rem; color: #57534e; letter-spacing: .02em; }
  h1 { font: 400 clamp(2.6rem, 7vw, 5rem)/1 "Instrument Serif", Georgia, serif; letter-spacing: -.02em; margin: .9rem 0 1rem; text-wrap: balance; }
  .chapo { color: #4b4845; font-size: 1.08rem; line-height: 1.55; max-width: 32rem; margin: 0 auto 2.4rem; }
  .rangee { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
  .note { margin-top: 2.2rem; font-size: .88rem; color: #5c5955; }
</style>
</head>
<body>
<main class="scene">
  <div class="bloc">
    <p class="sur">Maison Vérant, orfèvre · Paris 3<sup>e</sup></p>
    <h1>L’argenterie de famille, remise à neuf.</h1>
    <p class="chapo">Restauration, réargenture et gravure de couverts anciens, au poids et sur devis.<span data-explication> Démo : textes fictifs.</span></p>
    <div class="rangee">
      <a class="chrome plein" href="#devis">Demander un devis</a>
      <a class="chrome" href="#atelier">Visiter l’atelier</a>
    </div>
    <p class="note" data-explication>Survolez ou tabulez : le reflet fait le tour de la lunette.</p>
  </div>
</main>
</body>
</html>
